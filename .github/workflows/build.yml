name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and cores
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build signed Free Dynamic release APK
        run: ./gradlew --stacktrace assembleFreeDynamicRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-FixedStorage-APK
          path: lemuroid-app/build/outputs/apk/freeDynamic/release/*.apk
          if-no-files-found: error
          retention-days: 14
